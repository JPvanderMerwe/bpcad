[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bpcad"
version = "0.1.0"
description = "Local, offline text-and-image-to-3D-printable-part pipeline. Bit Primitive."
readme = "README.md"
requires-python = ">=3.11"

# Kept deliberately tight. Nothing here is a GPU library, a cloud SDK or a web
# framework, and httpx only ever talks to a loopback host - see bpcad/models/base.py.
dependencies = [
    "cadquery",
    "numpy",
    "pillow",
    "scikit-image",
    # scipy arrives with scikit-image anyway, but bpcad/build/cells.py imports
    # scipy.spatial.Voronoi directly. A dependency you use by name is one you
    # declare, or it disappears the day the transitive one is dropped.
    "scipy",
    "trimesh",
    "matplotlib",
    "pydantic>=2",
    "typer",
    "httpx",
    # spec.yaml is the durable artifact of this project and needs a parser.
    # Approved as an addition to the dependency list in the brief.
    "pyyaml",
]

[project.optional-dependencies]
# PHOTO TO MESH. Deliberately optional and deliberately large: torch plus
# TripoSR's weights is about 2.5 GB, and bpcad has to install and run on a
# machine that has neither - every part in parts/ rebuilds from its spec.yaml
# with this absent. Turn it on in config: [reconstruct] backend = "triposr".
#
# tsr (the TripoSR model code) is not published as a wheel, so it comes from
# the repository. Pinned to a commit rather than a branch: a reconstruction
# model that silently changes under a product is a part that silently changes
# shape.
reconstruct = [
    "torch",
    "torchvision",
    "transformers",
    "einops",
    "omegaconf",
    "huggingface-hub",
    # Background removal. Without it a photograph shot on a worktop
    # reconstructs the worktop as part of the object.
    "rembg",
    "onnxruntime",
]

# The desktop app. Kept optional so the pipeline still installs on a headless
# box - the CLI, and everything it drives, needs none of this.
# VTK is not listed: it arrives with cadquery, and pinning it separately would
# only create a chance for the two to disagree.
gui = ["PySide6>=6.6"]
dev = ["pytest"]

[project.scripts]
bpcad = "bpcad.cli:app"

[project.gui-scripts]
bpcad-gui = "bpcad.gui.shell:main"

[tool.setuptools.packages.find]
include = ["bpcad*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
