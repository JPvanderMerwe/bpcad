pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // 8.1.1 AT MINIMUM, not a taste. androidx.webkit 1.14.0 - pulled in by
    // the 3D viewer's WebView - declares that it needs Android Gradle plugin
    // 8.1.1 or higher, and the Flutter template generated 8.1.0. The build
    // fails at checkDebugAarMetadata with that exact sentence.
    //
    // 8.3.2 rather than the bare minimum 8.1.1, and it moves the Gradle
    // wrapper with it: AGP 8.3.x requires Gradle 8.4 or higher, so the
    // wrapper went from 8.3 to 8.4 in the same change. I first claimed 8.3.2
    // paired with the existing 8.3 wrapper; the build refused with
    // "Minimum supported Gradle version is 8.4", which is the correction.
    id "com.android.application" version "8.3.2" apply false
    id "org.jetbrains.kotlin.android" version "1.8.22" apply false
}

include ":app"
